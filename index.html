	<!-- The share card is the front page itself, at card size. -->

	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818">

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link rel="stylesheet" href="./css/styles.css">

	<!-- The portfolio lived here until August 2026, and links into its
	     drawers are still out in the world. A hash that belongs to the work
	     list gets carried to it rather than dying quietly on the card. -->
	<script>
		if (/^#([dr]-|work$)/.test(location.hash)) {
			location.replace('./work/' + (location.hash === '#work' ? '' : location.hash));
		}
	</script>
</head>
