<!doctype html>
<meta charset="utf-8">
<!-- The share cards are composed here, not screenshotted: the site's own
     grammar set at the size a preview is read at. Open this page from the
     repository root and photograph each .card at its exact box; the site
     card goes to img/card.png, each case card to img/work/<case>/card.jpg. -->
<style>
@font-face { font-family: "Switzer"; font-style: normal; font-weight: 300; src: url("../fonts/switzer-300.woff2") format("woff2"); }
@font-face { font-family: "Switzer"; font-style: normal; font-weight: 500; src: url("../fonts/switzer-500.woff2") format("woff2"); }

/* The cards are layouts for the format, not screenshots: the site's own
   grammar, set at the size a preview is read at. */
* { box-sizing: border-box; margin: 0; }
body { background: #666; font-family: "Switzer", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

.card {
	width: 1200px; height: 630px;
	background: #ffffff; color: #181818;
	overflow: hidden;
	position: relative;
	margin-bottom: 20px;
}

/* The site card: trail, portrait, and the claim on the floor. */
.card--site { padding: 56px 64px; display: flex; flex-direction: column; }
.card--site .trail { font-size: 30px; font-weight: 500; }
.card--site .portrait { position: absolute; top: 56px; right: 64px; width: 210px; }
.card--site .claim {
	margin-top: auto;
	font-size: 68px; line-height: 1.2; font-weight: 500; letter-spacing: -0.01em;
	max-width: 950px;
}

/* A case card: the wall plate at card size. Rule, row, cover. */
.card--case { display: flex; flex-direction: column; }
.card--case .head { padding: 44px 64px 36px; }
.card--case .rule { height: 3px; background: #dfdfdf; margin-bottom: 32px; }
.card--case .row { display: flex; align-items: center; gap: 28px; }
.card--case .row img { width: 64px; height: 64px; }
.card--case .name { font-size: 44px; font-weight: 500; }
.card--case .byline { font-size: 34px; font-weight: 300; color: #686868; }
.card--case .arrow { margin-left: auto; color: #8b8b8b; }
.card--case .cover { flex: 1 1 auto; min-height: 0; background: #d9d9d9; }
.card--case .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card--case .cover--inset { padding: 44px; }
.card--case .cover--inset img { object-fit: contain; }
</style>

<div class="card card--site" id="site">
	<p class="trail">Carl Ejlers</p>
	<img class="portrait" src="../img/carl.jpg" alt="">
	<p class="claim">Ten years designing digital products.</p>
</div>

<template id="case-template"></template>
<script>
const CASES = [
	['economic', '../img/logos/economic-canvas.png', 'Visma e-conomic', 'Accounting Platform', '../img/work/economic/e1.png', 'inset'],
	['theorg', '../img/logos/theorg-canvas.png', 'The Org', 'Employee Engagement Platform', '../img/theorg/cover.jpg', 'full'],
	['trackman', '../img/logos/trackman.png', 'TrackMan', 'Virtual Golf Interface', '../img/work/trackman/track1-page.jpg', 'inset'],
	['donkey', '../img/logos/donkey.png', 'Donkey Republic', 'Bike Rental Platform', '../img/work/donkey/cover.jpg', 'full'],
	['tv2', '../img/logos/lorry.png', 'TV2 Regionerne', 'White-label News App', '../img/work/tv2/cover.jpg', 'full'],
	['ok', '../img/logos/ok.png', 'OK', 'Charging and Parking Features', '../img/work/ok/OK-2.png', 'inset'],
];
for (const [slug, mark, name, byline, cover, mode] of CASES) {
	const el = document.createElement('div');
	el.className = 'card card--case';
	el.id = slug;
	el.innerHTML = `
	<div class="head">
		<div class="rule"></div>
		<div class="row">
			<img src="${mark}" alt="">
			<span class="name">${name}</span>
			<span class="byline">${byline}</span>
			<svg class="arrow" width="44" height="44" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-2 10h19" /><path d="M12 5l5 5-5 5" /></svg>
		</div>
	</div>
	<div class="cover ${mode === 'inset' ? 'cover--inset' : ''}"><img src="${cover}" alt=""></div>`;
	document.body.appendChild(el);
}
</script>
